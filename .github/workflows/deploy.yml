name: Deploy Mouher Storefront

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/storefront

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_MEDUSA_BACKEND_URL: ${{ vars.VITE_MEDUSA_BACKEND_URL || secrets.VITE_MEDUSA_BACKEND_URL }}
      VITE_MEDUSA_PUBLISHABLE_KEY: ${{ vars.VITE_MEDUSA_PUBLISHABLE_KEY || secrets.VITE_MEDUSA_PUBLISHABLE_KEY }}
      VITE_MEDUSA_REGION_ID: ${{ vars.VITE_MEDUSA_REGION_ID || secrets.VITE_MEDUSA_REGION_ID }}
      VITE_MEDUSA_COUNTRY_CODE: ${{ vars.VITE_MEDUSA_COUNTRY_CODE || 'ir' }}
      VITE_MEDUSA_CURRENCY_CODE: ${{ vars.VITE_MEDUSA_CURRENCY_CODE || 'irr' }}
      VITE_ALLOW_STATIC_CATALOG_FALLBACK: ${{ vars.VITE_ALLOW_STATIC_CATALOG_FALLBACK || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build storefront
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload storefront build
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storefront/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
