name: Deploy Mouher Storefront

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/storefront

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install dependencies
        # package.json now includes the Medusa JS SDK. Use npm install until
        # the generated package-lock.json is refreshed and committed locally.
        run: npm install --no-audit --no-fund

      - name: Build storefront
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload storefront build
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storefront/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
