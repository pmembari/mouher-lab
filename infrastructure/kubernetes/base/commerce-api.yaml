apiVersion: apps/v1
kind: Deployment
metadata:
  name: mouher-commerce-api
  labels:
    app.kubernetes.io/name: mouher-commerce-api
    app.kubernetes.io/part-of: mouher-commerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mouher-commerce-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mouher-commerce-api
        app.kubernetes.io/part-of: mouher-commerce
    spec:
      containers:
        - name: api
          image: ghcr.io/mouher/mouher-commerce-api:replace-me
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: mouher-config
            - secretRef:
                name: mouher-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/commerce/health/
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/commerce/health/
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mouher-commerce-api
spec:
  selector:
    app.kubernetes.io/name: mouher-commerce-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mouher-commerce-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mouher-commerce-api
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
