apiVersion: v1
kind: Service
metadata:
  name: mouher-postgres
spec:
  type: ExternalName
  externalName: postgres.mouher.example
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: mouher-redis
spec:
  type: ExternalName
  externalName: redis.mouher.example
  ports:
    - name: redis
      port: 6379
