apiVersion: apps/v1
kind: Deployment
metadata:
  name: mouher-payment-service
  labels:
    app.kubernetes.io/name: mouher-payment-service
    app.kubernetes.io/part-of: mouher-commerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mouher-payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mouher-payment-service
        app.kubernetes.io/part-of: mouher-commerce
    spec:
      containers:
        - name: payment-service
          image: ghcr.io/mouher/mouher-payment-service:replace-me
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: mouher-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mouher-payment-service
spec:
  selector:
    app.kubernetes.io/name: mouher-payment-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mouher-payment-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mouher-payment-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
