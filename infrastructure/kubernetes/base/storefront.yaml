apiVersion: apps/v1
kind: Deployment
metadata:
  name: mouher-storefront
  labels:
    app.kubernetes.io/name: mouher-storefront
    app.kubernetes.io/part-of: mouher-commerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mouher-storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mouher-storefront
        app.kubernetes.io/part-of: mouher-commerce
    spec:
      containers:
        - name: storefront
          image: ghcr.io/mouher/mouher-storefront:replace-me
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mouher-storefront
spec:
  selector:
    app.kubernetes.io/name: mouher-storefront
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mouher-storefront
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mouher-storefront
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
