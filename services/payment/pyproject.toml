[project]
name = "mouher-payment-service"
version = "0.1.0"
description = "Isolated Mouher payment adapter service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.118,<1.0",
  "pydantic>=2.11,<3.0",
  "uvicorn[standard]>=0.37,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
packages = ["app"]
